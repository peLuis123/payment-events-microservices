service: webhook-service
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    PAYMENT_EVENTS_TOPIC_ARN: ${env:PAYMENT_EVENTS_TOPIC_ARN}
    STRIPE_WEBHOOK_SECRET: ${env:STRIPE_WEBHOOK_SECRET}
    PAYPAL_CLIENT_ID: ${env:PAYPAL_CLIENT_ID, ''}
    PAYPAL_CLIENT_SECRET: ${env:PAYPAL_CLIENT_SECRET, ''}
    PAYPAL_WEBHOOK_ID: ${env:PAYPAL_WEBHOOK_ID}
    PAYPAL_WEBHOOK_SECRET: ${env:PAYPAL_WEBHOOK_SECRET}
    PAYPAL_ENVIRONMENT: ${env:PAYPAL_ENVIRONMENT, 'sandbox'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: ${env:PAYMENT_EVENTS_TOPIC_ARN}

functions:
  webhook:
    handler: src/handler.handler
    url:
      cors: true
    timeout: 15
    events: []

resources:
  Resources:
    WebhookDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: webhook-service-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
