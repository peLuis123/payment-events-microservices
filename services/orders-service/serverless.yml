service: orders-service
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  logRetentionInDays: 1
  region: ${opt:region, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    PAYMENT_PROCESSOR_CHECKOUT_URL: ${env:PAYMENT_PROCESSOR_CHECKOUT_URL}
    MERCHANT_API_KEYS: ${env:MERCHANT_API_KEYS, ''}
    RATE_LIMIT_WINDOW_MS: ${env:RATE_LIMIT_WINDOW_MS, '60000'}
    RATE_LIMIT_MAX: ${env:RATE_LIMIT_MAX, '60'}
    USERS_TABLE: ${env:USERS_TABLE, 'Users'}
    REFRESH_TOKENS_TABLE: ${env:REFRESH_TOKENS_TABLE, 'RefreshTokens'}
    AUTH_TOKEN_SECRET: ${env:AUTH_TOKEN_SECRET, 'development-only-secret'}
    FRONTEND_ORIGIN: ${env:FRONTEND_ORIGIN, 'http://localhost:5000'}
    PRODUCTS_TABLE: ${env:PRODUCTS_TABLE, 'Products'}
    CATEGORIES_TABLE: ${env:CATEGORIES_TABLE, 'Categories'}
    MERCHANTS_TABLE: ${env:MERCHANTS_TABLE, 'Merchants'}
    MERCHANT_USERS_TABLE: ${env:MERCHANT_USERS_TABLE, 'MerchantUsers'}
    CARTS_TABLE: ${env:CARTS_TABLE, 'Carts'}
    CART_ITEMS_TABLE: ${env:CART_ITEMS_TABLE, 'CartItems'}
    COMMERCIAL_ORDERS_TABLE: ${env:COMMERCIAL_ORDERS_TABLE, 'CommercialOrders'}
    ORDER_ITEMS_TABLE: ${env:ORDER_ITEMS_TABLE, 'OrderItems'}
    INVENTORY_TABLE: ${env:INVENTORY_TABLE, 'Inventory'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: ${env:SQS_QUEUE_ARN}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:USERS_TABLE, 'Users'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:USERS_TABLE, 'Users'}/index/EmailIndex
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:REFRESH_TOKENS_TABLE, 'RefreshTokens'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:PRODUCTS_TABLE, 'Products'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:PRODUCTS_TABLE, 'Products'}/index/MerchantIndex
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:CATEGORIES_TABLE, 'Categories'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:CATEGORIES_TABLE, 'Categories'}/index/MerchantIndex
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:MERCHANTS_TABLE, 'Merchants'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:MERCHANT_USERS_TABLE, 'MerchantUsers'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:CARTS_TABLE, 'Carts'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:CART_ITEMS_TABLE, 'CartItems'}/index/CartIndex
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:COMMERCIAL_ORDERS_TABLE, 'CommercialOrders'}/index/MerchantIndex
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:ORDER_ITEMS_TABLE, 'OrderItems'}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:INVENTORY_TABLE, 'Inventory'}

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:USERS_TABLE, 'Users'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    RefreshTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:REFRESH_TOKENS_TABLE, 'RefreshTokens'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: tokenHash
            KeyType: HASH
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:PRODUCTS_TABLE, 'Products'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: merchantId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: MerchantIndex
            KeySchema:
              - AttributeName: merchantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    CategoriesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:CATEGORIES_TABLE, 'Categories'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: categoryId
            AttributeType: S
          - AttributeName: merchantId
            AttributeType: S
        KeySchema:
          - AttributeName: categoryId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: MerchantIndex
            KeySchema:
              - AttributeName: merchantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    MerchantsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:MERCHANTS_TABLE, 'Merchants'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: merchantId
            AttributeType: S
        KeySchema:
          - AttributeName: merchantId
            KeyType: HASH
    MerchantUsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:MERCHANT_USERS_TABLE, 'MerchantUsers'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: merchantId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: merchantId
            KeyType: HASH
          - AttributeName: userId
            KeyType: RANGE
    CartsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:CARTS_TABLE, 'Carts'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cartId
            AttributeType: S
        KeySchema:
          - AttributeName: cartId
            KeyType: HASH
    CartItemsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:CART_ITEMS_TABLE, 'CartItems'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cartItemId
            AttributeType: S
          - AttributeName: cartId
            AttributeType: S
        KeySchema:
          - AttributeName: cartItemId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CartIndex
            KeySchema:
              - AttributeName: cartId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    CommercialOrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:COMMERCIAL_ORDERS_TABLE, 'CommercialOrders'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: merchantId
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: MerchantIndex
            KeySchema:
              - AttributeName: merchantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    OrderItemsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:ORDER_ITEMS_TABLE, 'OrderItems'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: lineItemId
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: lineItemId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OrderIndex
            KeySchema:
              - AttributeName: orderId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    InventoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:INVENTORY_TABLE, 'Inventory'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH

functions:
  app:
    handler: src/handler.handler
    url:
      cors:
        allowedOrigins:
          - ${env:FRONTEND_ORIGIN, 'http://localhost:5173'}
        allowedHeaders:
          - Content-Type
          - Cookie
          - X-Api-Key
          - X-Merchant-Id
          - Idempotency-Key
        allowedMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowCredentials: true
