openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.1.0
  description: Receives payment orders and publishes asynchronous payment events.
servers:
  - url: /
    description: Current Orders Service host
paths:
  /merchants:
    post:
      summary: Create a merchant
      operationId: createMerchant
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/AuthCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, defaultCurrency]
              properties:
                name:
                  type: string
                defaultCurrency:
                  type: string
                  pattern: "^[A-Z]{3}$"
      responses:
        "201":
          description: Merchant created.
        "403":
          description: Admin role required.
  /products:
    get:
      summary: List merchant products
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      responses:
        "200":
          description: Product list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
    post:
      summary: Create a product
      operationId: createProduct
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/AuthCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          description: Admin role required.
  /categories:
    get:
      summary: List merchant categories
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/MerchantId"
      responses:
        "200":
          description: Category list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      summary: Create a category
      operationId: createCategory
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "403":
          description: Admin role required.
  /auth/register:
    post:
      summary: Register a buyer account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      summary: Log in a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful. HttpOnly cookies are set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    post:
      summary: Accept a payment order
      operationId: createOrder
      description: Validates and queues an order. Payment processing happens asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              orderId: order-123
              customerId: customer-456
              amount: 49.99
              currency: USD
      responses:
        "202":
          description: Order accepted and published to SQS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOrderResponse"
        "400":
          description: Invalid order payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/sessions:
    post:
      summary: Create a payment checkout session
      operationId: createCheckoutSession
      description: Creates a pending Stripe or PayPal checkout session through the payment processor.
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
            example:
              paymentProvider: paypal
              items:
                - productId: product-123
                  quantity: 1
                  unitAmount: 4999
              currency: USD
              successUrl: https://frontend.example/success
              cancelUrl: https://frontend.example/cancel
              externalReference: cart-123
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Invalid checkout session payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Checkout provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/{paymentId}:
    get:
      summary: Get payment status
      operationId: getPayment
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current payment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /refunds:
    post:
      summary: Create a payment refund
      operationId: createRefund
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          description: Invalid refund request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merchants/{merchantId}/balance:
    get:
      summary: Get merchant balance
      operationId: getMerchantBalance
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current available merchant balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Merchant identity does not match the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payouts:
    post:
      summary: Create a merchant payout
      operationId: createPayout
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutRequest"
      responses:
        "201":
          description: Payout created or submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutResponse"
        "400":
          description: Invalid payout request or insufficient balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AuthCookie:
      name: Cookie
      in: header
      required: true
      schema:
        type: string
      description: HttpOnly access_token cookie issued by /auth/login.
    MerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, currency]
      properties:
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        categoryId:
          type: string
        price:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        imageUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        stock:
          type: integer
          minimum: 0
    ProductResponse:
      allOf:
        - $ref: "#/components/schemas/CreateProductRequest"
        - type: object
          required: [productId, merchantId, status]
          properties:
            productId:
              type: string
            merchantId:
              type: string
            status:
              type: string
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    CategoryResponse:
      allOf:
        - $ref: "#/components/schemas/CreateCategoryRequest"
        - type: object
          required: [categoryId, merchantId, status]
          properties:
            categoryId:
              type: string
            merchantId:
              type: string
            status:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      required: [userId, email, role, status]
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [buyer, admin]
        status:
          type: string
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [orderId, customerId, amount, currency]
      properties:
        orderId:
          type: string
          pattern: "^order-[A-Za-z0-9-]+$"
        customerId:
          type: string
          pattern: "^customer-[A-Za-z0-9-]+$"
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: USD
    AcceptedOrderResponse:
      type: object
      required: [message, eventId]
      properties:
        message:
          type: string
          example: Order accepted
        eventId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required:
        [
          items,
          currency,
          paymentProvider,
          successUrl,
          cancelUrl,
          externalReference,
        ]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity, unitAmount]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitAmount:
                type: integer
                minimum: 1
                description: Amount in the smallest currency unit, such as cents.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        paymentProvider:
          type: string
          enum: [stripe, paypal]
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        externalReference:
          type: string
    CheckoutSessionResponse:
      type: object
      required: [checkoutId, checkoutUrl, paymentId, status]
      properties:
        checkoutId:
          type: string
        checkoutUrl:
          type: string
          format: uri
        paymentId:
          type: string
        status:
          type: string
          enum: [pending]
    PaymentResponse:
      type: object
      required: [paymentId, provider, status]
      properties:
        paymentId:
          type: string
        orderId:
          type: string
        provider:
          type: string
          enum: [stripe, paypal]
        status:
          type: string
          enum: [pending, approved, rejected, refunded, disputed, cancelled]
        amount:
          type: integer
        currency:
          type: string
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [paymentId, amount, currency]
      properties:
        paymentId:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    RefundResponse:
      type: object
      required: [refundId, providerRefundId, status]
      properties:
        refundId:
          type: string
        providerRefundId:
          type: string
        status:
          type: string
    BalanceResponse:
      type: object
      required: [merchantId, available, pending, currency]
      properties:
        merchantId:
          type: string
        available:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required: [payoutId, provider, merchantAccountId, amount, currency]
      properties:
        payoutId:
          type: string
        provider:
          type: string
          enum: [stripe, paypal]
        merchantAccountId:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    PayoutResponse:
      type: object
      required: [payoutId, providerPayoutId, status]
      properties:
        payoutId:
          type: string
        providerPayoutId:
          type: string
        status:
          type: string
