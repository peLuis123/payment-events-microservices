openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.1.0
  description: Receives payment orders and publishes asynchronous payment events.
servers:
  - url: /
    description: Current Orders Service host
paths:
  /orders:
    post:
      summary: Accept a payment order
      operationId: createOrder
      description: Validates and queues an order. Payment processing happens asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              orderId: order-123
              customerId: customer-456
              amount: 49.99
              currency: USD
      responses:
        "202":
          description: Order accepted and published to SQS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedOrderResponse"
        "400":
          description: Invalid order payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/sessions:
    post:
      summary: Create a payment checkout session
      operationId: createCheckoutSession
      description: Creates a pending Stripe or PayPal checkout session through the payment processor.
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutSessionRequest"
            example:
              paymentProvider: paypal
              items:
                - productId: product-123
                  quantity: 1
                  unitAmount: 4999
              currency: USD
              successUrl: https://frontend.example/success
              cancelUrl: https://frontend.example/cancel
              externalReference: cart-123
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Invalid checkout session payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Checkout provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payments/{paymentId}:
    get:
      summary: Get payment status
      operationId: getPayment
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current payment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /refunds:
    post:
      summary: Create a payment refund
      operationId: createRefund
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          description: Invalid refund request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merchants/{merchantId}/balance:
    get:
      summary: Get merchant balance
      operationId: getMerchantBalance
      parameters:
        - $ref: "#/components/parameters/MerchantId"
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current available merchant balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Merchant identity does not match the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    MerchantId:
      name: X-Merchant-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [orderId, customerId, amount, currency]
      properties:
        orderId:
          type: string
          pattern: "^order-[A-Za-z0-9-]+$"
        customerId:
          type: string
          pattern: "^customer-[A-Za-z0-9-]+$"
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: USD
    AcceptedOrderResponse:
      type: object
      required: [message, eventId]
      properties:
        message:
          type: string
          example: Order accepted
        eventId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required:
        [
          items,
          currency,
          paymentProvider,
          successUrl,
          cancelUrl,
          externalReference,
        ]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity, unitAmount]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitAmount:
                type: integer
                minimum: 1
                description: Amount in the smallest currency unit, such as cents.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        paymentProvider:
          type: string
          enum: [stripe, paypal]
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        externalReference:
          type: string
    CheckoutSessionResponse:
      type: object
      required: [checkoutId, checkoutUrl, paymentId, status]
      properties:
        checkoutId:
          type: string
        checkoutUrl:
          type: string
          format: uri
        paymentId:
          type: string
        status:
          type: string
          enum: [pending]
    PaymentResponse:
      type: object
      required: [paymentId, provider, status]
      properties:
        paymentId:
          type: string
        orderId:
          type: string
        provider:
          type: string
          enum: [stripe, paypal]
        status:
          type: string
          enum: [pending, approved, rejected, refunded, disputed, cancelled]
        amount:
          type: integer
        currency:
          type: string
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required: [paymentId, amount, currency]
      properties:
        paymentId:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    RefundResponse:
      type: object
      required: [refundId, providerRefundId, status]
      properties:
        refundId:
          type: string
        providerRefundId:
          type: string
        status:
          type: string
    BalanceResponse:
      type: object
      required: [merchantId, available, pending, currency]
      properties:
        merchantId:
          type: string
        available:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
