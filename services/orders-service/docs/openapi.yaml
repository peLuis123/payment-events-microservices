openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.1.0
  description: Receives payment orders and publishes asynchronous payment events.
servers:
  - url: /
    description: Current Orders Service host
paths:
  /me/merchants:
    get:
      summary: List active stores administered by the signed-in user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active stores with merchantId, name and defaultCurrency. Empty when no active memberships.
        '401':
          description: Session required.
        '403':
          description: Admin role required.
  /carts/{cartId}/items:
    post:
      summary: Add a product to a cart
      operationId: addCartItem
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Cart item added.
  /carts:
    post:
      summary: Create an empty cart
      operationId: createCart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                merchantId:
                  type: string
                  example: merchant-123
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  example: USD
      responses:
        '201':
          description: Cart created.
      security:
        - sessionCookie: []
      description: >-
        Creates a cart in the configured STOREFRONT_MERCHANT_ID (or merchantId query). Requires an active
        merchant. Optional body merchantId must match.
      parameters:
        - $ref: '#/components/parameters/MerchantId'
  /carts/{cartId}:
    get:
      summary: Get a cart
      operationId: getCart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cart and its items returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          description: Cart not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /commercial-orders:
    get:
      summary: List current user commercial orders
      operationId: listCommercialOrders
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Commercial order history.
    post:
      summary: Create a commercial order from a cart
      operationId: createCommercialOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cartId
              properties:
                cartId:
                  type: string
      responses:
        '201':
          description: Commercial order created.
  /commercial-orders/{orderId}/inventory-reservations:
    post:
      summary: Reserve inventory for an order
      operationId: reserveInventory
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Inventory reserved.
      security:
        - sessionCookie: []
      description: >-
        Uses saved order lines, never client quantities. Transaction includes reservation marker, inventory
        and product stock. Maximum 49 distinct products. Owner only.
  /commercial-orders/{orderId}/checkout:
    post:
      summary: Create checkout for a commercial order
      operationId: createCommercialCheckout
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentProvider
                - successUrl
                - cancelUrl
                - idempotencyKey
              properties:
                paymentProvider:
                  type: string
                  enum:
                    - stripe
                    - paypal
                cancelUrl:
                  type: string
                  format: uri
                successUrl:
                  type: string
                  format: uri
                  description: Use /checkout/success?paymentId={paymentId}; backend replaces the placeholder.
                idempotencyKey:
                  type: string
      responses:
        '201':
          description: Checkout session created.
  /merchants:
    post:
      summary: Create a merchant
      operationId: createMerchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - defaultCurrency
              properties:
                name:
                  type: string
                defaultCurrency:
                  type: string
                  pattern: ^[A-Z]{3}$
      responses:
        '201':
          description: Merchant created.
        '403':
          description: Admin role required.
      security:
        - sessionCookie: []
      description: >-
        Admin session required. ownerUserId is always the authenticated user; the service also creates their
        active admin membership.
  /products:
    get:
      summary: List merchant products
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Product list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
      security: []
      description: Active public catalog; defaults to STOREFRONT_MERCHANT_ID. includeInactive=true requires member admin.
    post:
      summary: Create a product
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '403':
          description: Admin role required.
        '409':
          description: 'MERCHANT_SELECTION_REQUIRED: select one of GET /me/merchants.'
      security:
        - sessionCookie: []
      description: >-
        Signed admin session and active merchant membership required. With one store, merchantId is automatic;
        with multiple stores, select using the merchantId query parameter. No merchant or role header grants
        access.
  /categories:
    get:
      summary: List merchant categories
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Category list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
      security: []
      description: Active public catalog; defaults to STOREFRONT_MERCHANT_ID. includeInactive=true requires member admin.
    post:
      summary: Create a category
      operationId: createCategory
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '403':
          description: Admin role required.
        '409':
          description: 'MERCHANT_SELECTION_REQUIRED: select one of GET /me/merchants.'
      security:
        - sessionCookie: []
      description: >-
        Signed admin session and active merchant membership required. With one store, merchantId is automatic;
        with multiple stores, select using the merchantId query parameter. No merchant or role header grants
        access.
  /auth/register:
    post:
      summary: Register a buyer account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Log in a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. HttpOnly cookies are set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or expired access cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Rotate the refresh cookie
      operationId: refreshSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session refreshed and cookies rotated.
        '401':
          description: Invalid refresh cookie.
  /auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        '204':
          description: Session ended and cookies cleared.
  /orders:
    post:
      summary: Accept a payment order
      operationId: createOrder
      description: >-
        Server integration only: verified X-Api-Key required. Browser checkout uses
        /commercial-orders/{orderId}/checkout with the owner session and saved prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              orderId: order-123
              customerId: customer-456
              amount: 49.99
              currency: USD
      responses:
        '202':
          description: Order accepted and published to SQS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedOrderResponse'
        '400':
          description: Invalid order payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - integrationKey: []
      parameters: []
  /checkout/sessions:
    post:
      summary: Create a payment checkout session
      operationId: createCheckoutSession
      description: >-
        Server integration only: verified X-Api-Key required. Browser checkout uses
        /commercial-orders/{orderId}/checkout with the owner session and saved prices.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
            example:
              paymentProvider: paypal
              items:
                - productId: product-123
                  quantity: 1
                  unitAmount: 4999
              currency: USD
              successUrl: https://frontend.example/success
              cancelUrl: https://frontend.example/cancel
              externalReference: cart-123
      responses:
        '201':
          description: Checkout session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          description: Invalid checkout session payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Checkout provider error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - integrationKey: []
  /payments/{paymentId}:
    get:
      summary: Get payment status
      operationId: getPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          description: Missing merchant authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - sessionCookie: []
        - integrationKey: []
  /refunds:
    post:
      summary: Create a payment refund
      operationId: createRefund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '400':
          description: Invalid refund request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - sessionCookie: []
      description: Active member admin of the payment merchant required. The merchant is derived from the saved payment.
  /merchants/{merchantId}/balance:
    get:
      summary: Get merchant balance
      operationId: getMerchantBalance
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current available merchant balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          description: Merchant identity does not match the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - sessionCookie: []
      description: Active member admin of the merchant in the path required.
  /payouts:
    post:
      summary: Create a merchant payout
      operationId: createPayout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayoutRequest'
      responses:
        '201':
          description: Payout created or submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutResponse'
        '400':
          description: Invalid payout request or insufficient balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - sessionCookie: []
      description: Active member admin required; sole store selected automatically, otherwise merchantId query is required.
  /carts/{cartId}/items/{productId}:
    patch:
      summary: Set quantity on an item in your active cart
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quantity:
                  type: integer
                  minimum: 1
              required:
                - quantity
      responses:
        '204':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
    delete:
      summary: Remove an item from your active cart; repeated deletion is safe
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
  /products/{productId}:
    get:
      summary: Read an active product; inactive products require member admin
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
    patch:
      summary: 'Member admin: edit or deactivate product; stock uses inventory endpoint'
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                price:
                  type: integer
                  minimum: 1
                  description: Minor currency units.
                currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                categoryId:
                  type: string
                sku:
                  type: string
                imageUrl:
                  type: string
                  format: uri
                images:
                  type: array
                  items:
                    type: string
                    format: uri
                attributes:
                  type: object
                  additionalProperties:
                    type: string
              required: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
  /categories/{categoryId}:
    patch:
      summary: 'Member admin: edit or deactivate category'
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                slug:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                    - active
                    - inactive
              required: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
  /commercial-orders/{orderId}:
    get:
      summary: 'Read order and immutable lines: owner or member admin'
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
  /merchants/{merchantId}/orders:
    get:
      summary: 'Member admin: list merchant orders'
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
  /products/{productId}/inventory:
    get:
      summary: 'Member admin: read available and reserved quantities'
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
    patch:
      summary: 'Member admin: set available stock without changing reservations; expected value prevents stale writes'
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                availableQuantity:
                  type: integer
                  minimum: 0
                expectedAvailableQuantity:
                  type: integer
                  minimum: 0
                  description: Value from latest inventory GET; use zero only when initializing missing inventory.
              required:
                - availableQuantity
                - expectedAvailableQuantity
      responses:
        '200':
          description: Success.
        '400':
          description: Invalid fields or quantities.
        '401':
          description: Session required.
        '403':
          description: Role, ownership or merchant membership denied.
        '404':
          description: Resource not found.
        '409':
          description: Stock or concurrent-update conflict. Reload before retrying.
components:
  securitySchemes:
    integrationKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Server integration secret; never expose in browser builds.
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    sessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: >-
        Signed access cookie from login. Admin operations additionally require active admin membership in the
        resource merchant.
  parameters:
    AuthCookie:
      name: Cookie
      in: header
      required: true
      schema:
        type: string
      description: HttpOnly access_token cookie issued by /auth/login.
    MerchantId:
      name: merchantId
      in: query
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  schemas:
    CartResponse:
      type: object
      required:
        - cartId
        - userId
        - merchantId
        - currency
        - status
        - items
      properties:
        cartId:
          type: string
        userId:
          type: string
        merchantId:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - cartItemId
              - productId
              - quantity
              - unitAmount
              - totalAmount
            properties:
              cartItemId:
                type: string
              productId:
                type: string
              quantity:
                type: integer
              unitAmount:
                type: integer
              totalAmount:
                type: integer
    CreateProductRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - price
        - currency
      properties:
        name:
          type: string
        sku:
          type: string
        description:
          type: string
        categoryId:
          type: string
        price:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        imageUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            type: string
            format: uri
        stock:
          type: integer
          minimum: 0
    ProductResponse:
      allOf:
        - $ref: '#/components/schemas/CreateProductRequest'
        - type: object
          required:
            - productId
            - merchantId
            - status
          properties:
            productId:
              type: string
            merchantId:
              type: string
            status:
              type: string
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
    CategoryResponse:
      allOf:
        - $ref: '#/components/schemas/CreateCategoryRequest'
        - type: object
          required:
            - categoryId
            - merchantId
            - status
          properties:
            categoryId:
              type: string
            merchantId:
              type: string
            status:
              type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserResponse:
      type: object
      required:
        - userId
        - email
        - role
        - status
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
            - buyer
            - admin
        status:
          type: string
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
        - customerId
        - amount
        - currency
      properties:
        orderId:
          type: string
          pattern: ^order-[A-Za-z0-9-]+$
        customerId:
          type: string
          pattern: ^customer-[A-Za-z0-9-]+$
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: USD
    AcceptedOrderResponse:
      type: object
      required:
        - message
        - eventId
      properties:
        message:
          type: string
          example: Order accepted
        eventId:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
    CreateCheckoutSessionRequest:
      type: object
      additionalProperties: false
      required:
        - items
        - currency
        - paymentProvider
        - successUrl
        - cancelUrl
        - externalReference
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - productId
              - quantity
              - unitAmount
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
              unitAmount:
                type: integer
                minimum: 1
                description: Amount in the smallest currency unit, such as cents.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        paymentProvider:
          type: string
          enum:
            - stripe
            - paypal
        successUrl:
          type: string
          format: uri
        cancelUrl:
          type: string
          format: uri
        externalReference:
          type: string
    CheckoutSessionResponse:
      type: object
      required:
        - checkoutId
        - checkoutUrl
        - paymentId
        - status
      properties:
        checkoutId:
          type: string
        checkoutUrl:
          type: string
          format: uri
        paymentId:
          type: string
        status:
          type: string
          enum:
            - pending
    PaymentResponse:
      type: object
      required:
        - paymentId
        - provider
        - status
      properties:
        paymentId:
          type: string
        orderId:
          type: string
        provider:
          type: string
          enum:
            - stripe
            - paypal
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - refunded
            - disputed
            - cancelled
        amount:
          type: integer
        currency:
          type: string
    CreateRefundRequest:
      type: object
      additionalProperties: false
      required:
        - paymentId
        - amount
        - currency
      properties:
        paymentId:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    RefundResponse:
      type: object
      required:
        - refundId
        - providerRefundId
        - status
      properties:
        refundId:
          type: string
        providerRefundId:
          type: string
        status:
          type: string
    BalanceResponse:
      type: object
      required:
        - merchantId
        - available
        - pending
        - currency
      properties:
        merchantId:
          type: string
        available:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required:
        - payoutId
        - provider
        - merchantAccountId
        - amount
        - currency
      properties:
        payoutId:
          type: string
        provider:
          type: string
          enum:
            - stripe
            - paypal
        merchantAccountId:
          type: string
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    PayoutResponse:
      type: object
      required:
        - payoutId
        - providerPayoutId
        - status
      properties:
        payoutId:
          type: string
        providerPayoutId:
          type: string
        status:
          type: string
