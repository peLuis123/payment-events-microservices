service: payment-processor
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  environment:
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE}
    PAYMENTS_TABLE: ${env:PAYMENTS_TABLE, 'Payments'}
    REFUNDS_TABLE: ${env:REFUNDS_TABLE, 'Refunds'}
    SNS_TOPIC_ARN: ${env:SNS_TOPIC_ARN}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
    PAYPAL_CLIENT_ID: ${env:PAYPAL_CLIENT_ID, ''}
    PAYPAL_CLIENT_SECRET: ${env:PAYPAL_CLIENT_SECRET, ''}
    PAYPAL_ENVIRONMENT: ${env:PAYPAL_ENVIRONMENT, 'sandbox'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - ${env:SQS_QUEUE_ARN}
            - Fn::GetAtt: [ProcessorDeadLetterQueue, Arn]
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - ${env:DYNAMODB_TABLE_ARN}
            - ${env:PAYMENTS_TABLE_ARN}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${env:REFUNDS_TABLE, 'Refunds'}
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: ${env:SNS_TOPIC_ARN}

functions:
  processor:
    handler: src/handler.handler
    events:
      - sqs:
          arn: ${env:SQS_QUEUE_ARN}
          batchSize: 10
          maximumBatchingWindow: 5
          functionResponseType: ReportBatchItemFailures
          enabled: true
  checkout:
    handler: src/checkout-handler.handler
    url:
      cors: true
    timeout: 15
  providerStatus:
    handler: src/provider-status-handler.handler
    events:
      - sns:
          arn: ${env:SNS_TOPIC_ARN}
          topicName: payment-events

resources:
  Resources:
    ProcessorDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-processor-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
    ProviderStatusDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payment-processor-provider-status-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600
